[project]
name = "desktop-backend"
version = "0.1.0"
description = "攒股收息 R1 桌面应用 Python sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
